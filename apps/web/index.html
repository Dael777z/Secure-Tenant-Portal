<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="One shared rent record, read the same way by residents and by management." />

    <!--
      No external stylesheets, no external fonts, no analytics. (The manager
      workspace uses Inter, self-hosted from apps/web/fonts/ — same origin.)

      This is a deliberate choice rather than a limitation. A webfont request to a
      third party sends every resident's IP address and page visit to that party
      on every load, which would sit badly in a system whose whole argument is
      that residents' data does not leave the operator's own infrastructure. The
      Content-Security-Policy the API sets forbids external origins outright, so
      the type below is a system-font stack chosen to sit close to the intended
      faces. To use the real ones, drop the .woff2 files into apps/web/fonts/,
      add @font-face rules in styles/tokens.css, and nothing else changes.
    -->
    <link rel="stylesheet" href="/app/src/styles/tokens.css" />
    <link rel="stylesheet" href="/app/src/styles/base.css" />
    <link rel="stylesheet" href="/app/src/styles/components.css" />
    <link rel="stylesheet" href="/app/src/styles/tenant.css" />
    <link rel="stylesheet" href="/app/src/styles/manager.css" />
    <link rel="stylesheet" href="/app/src/styles/workspace.css" />
    <link rel="stylesheet" href="/app/src/styles/messages.css" />
    <link rel="stylesheet" href="/app/src/styles/portfolio.css" />

    />
