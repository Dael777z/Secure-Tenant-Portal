# On every push and pull request: type checks, the whole test suite (unit + integration)
# with coverage floors, and an informational dependency audit.
# Integration tests need a real Postgres, so one runs beside the job as a service.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Types are checked for the server and the frontend, so a type error fails the build
  # even when no test happens to touch it.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server types
        run: npx tsc -p tsconfig.json --noEmit
      - name: Frontend types
        run: npx tsc -p frontend/tsconfig.json --noEmit

  # Known-vulnerable dependencies are reported on every run but do not block it:
  # the fix is usually an upgrade the team schedules, not something a pull request should be held for.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16        # same major version as compose.yaml
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail loudly if the database is unreachable: a skipped integration test is not a pass.
      - name: Check the test database is reachable
        run: node -e "const {Client}=require('pg');const c=new Client({connectionString:process.env.TEST_DATABASE_URL});c.connect().then(()=>c.end()).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: Tests with coverage
        run: npx vitest run --coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e "
          const fs=require('fs');if(!fs.existsSync('coverage/coverage-summary.json'))process.exit(0)
          const t=JSON.parse(fs.readFileSync('coverage/coverage-summary.json')).total
          const row=k=>'| '+k+' | '+t[k].pct+'% | '+t[k].covered+' / '+t[k].total+' |'
          console.log(['## Coverage (unit + integration)','','| | % | covered |','|---|---|---|',...['lines','statements','functions','branches'].map(row)].join('\n'))
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
